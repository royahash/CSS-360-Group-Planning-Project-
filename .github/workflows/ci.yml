name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Check formatting (Prettier)
        run: npm run format

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm run audit