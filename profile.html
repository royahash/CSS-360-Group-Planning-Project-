<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-layout">

    <div class="sidebar-left">
      <a href="index.html">
        <button class="side-btn"><i class="fa-solid fa-house"></i></button>
      </a>
    </div>

    <div class="main-content">
      <div class="header">
        <h1>My Profile</h1>
        <p>Your event preferences and onboarding choices</p>
      </div>

      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
          <div>
            <h2>Welcome back</h2>
            <p>Here are the categories you selected during onboarding.</p>
          </div>
        </div>

        <div class="profile-info-card">
          <h3>Preferred interests</h3>
          <div id="interestList" class="interest-list"></div>
          <div id="emptyState" class="empty-state" style="display: none;">
            You have not chosen any interests yet. Visit onboarding to save your favorite event categories.
          </div>
        </div>

        <div class="profile-actions">
          <a href="onboarding.html"><button class="card-btn">Update interests</button></a>
          <a href="index.html"><button class="card-btn">Back to events</button></a>
        </div>
      </div>
    </div>

    <div class="sidebar-right">
      <button class="side-btn active"><i class="fa-solid fa-user"></i></button>
      <a href="calendar.html">
        <button class="side-btn"><i class="fa-solid fa-calendar"></i></button>
      </a>
      <button class="side-btn"><i class="fa-solid fa-user-group"></i></button>
    </div>

  </div>

  <script>
    function loadProfileInterests() {
      const saved = JSON.parse(localStorage.getItem('selectedInterests') || '[]');
      const interestList = document.getElementById('interestList');
      const emptyState = document.getElementById('emptyState');

      if (!saved.length) {
        interestList.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      interestList.innerHTML = saved.map(interest => `
        <span class="interest-chip">${interest}</span>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadProfileInterests);
  </script>

</body>
</html>
