<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Event Explorer</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<!-- THREE COLUMN LAYOUT -->
<div class="page-layout"> 
  <!-- Left Column -->
  <div class="sidebar-left">
    <a href="index.html">
      <button class="side-btn"><i class="fa-solid fa-house"></i></button>
    </a>
  </div>

  <!-- Center Column -->  
  <div class="main-content">
    <div class="header">
      <h1>Event Explorer</h1>
      <p>Find local events near you</p>
      <div id="user-greeting" style="font-size: 14px; color: #666; margin-top: 4px;"></div>
      <div class="sort-controls">
        <button class="sort-btn active-sort" id="sort-date" onclick="setSort('date,asc')">Soonest</button>
        <button class="sort-btn" id="sort-newest" onclick="setSort('date,desc')">Latest</button>
      </div>
    </div>
    <div class="event-container">
    </div>
  </div>

  <!-- Right Column -->
  <div class="sidebar-right">
    <a href="profile.html">
      <button class="side-btn"><i class="fa-solid fa-user"></i></button>
    </a>
    <a href="calendar.html">
      <button class="side-btn"><i class="fa-solid fa-calendar"></i></button>
    </a>
    <button class="side-btn"><i class="fa-solid fa-user-group"></i></button>
    <a href="event-request.html">
      <button class="side-btn"><i class="fa-solid fa-plus"></i></button>
    </a>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/index.js"></script>
<script src="../js/savedEvents.js"></script>
<script src="../js/events.js"></script>
<script type="module">
  import { getCurrentUser } from '../js/auth.js';
  const user = await getCurrentUser();
  // Don't redirect — guests can browse, just can't save
  if (user) {
    window.currentUser = user;
  }
</script>
</script>

</script>
</body>
</html>
