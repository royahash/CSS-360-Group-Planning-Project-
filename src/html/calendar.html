<!DOCTYPE html>
<html>
<head>
  <title>Calendar</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="page-layout">
    <aside class="sidebar-left">
      <button class="side-btn" onclick="window.location.href='index.html'">⌂</button>
    </aside>

    <main class="main-content">
      <div class="header">
        <h1>Calendar</h1>
        <p>View your saved events and event requests</p>
      </div>

      <div class="calendar-controls-wrapper">
        <div class="calendar-controls">
          <button class="card-btn" id="monthViewBtn">Monthly</button>
          <button class="card-btn" id="weekViewBtn">Weekly</button>
        </div>
      </div>

      <div class="calendar-layout">
        <aside class="calendar-sidebar">
          <h3>Calendars</h3>

          <label class="calendar-select-all">
            <span>Select All</span>
            <input type="checkbox" checked>
          </label>

          <hr>

          <label class="calendar-you">
            <span>My Calendar</span>
            <input type="checkbox" checked>
          </label>

          <label class="calendar-group">
            <span>Event Requests</span>
            <input type="checkbox" checked>
          </label>

          <label class="calendar-friends">
            <span>Friend Events</span>
            <input type="checkbox" checked>
          </label>
        </aside>

        <section class="calendar-main">
          <div id="calendarEvents" class="calendar-container"></div>
        </section>
      </div>
    </main>

    <aside class="sidebar-right">
      <button class="side-btn" onclick="window.location.href='profile.html'">👤</button>
      <button class="side-btn active" onclick="window.location.href='calendar.html'">🗓</button>
      <button class="side-btn" onclick="window.location.href='friends.html'">👥</button>
      <button class="side-btn" onclick="window.location.href='event-request.html'">＋</button>
    </aside>
  </div>

  <script src="../js/calendar.js"></script>
</body>
</html>
