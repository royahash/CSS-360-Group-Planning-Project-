<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <title>Calendar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="page-layout">

    <aside class="sidebar-left">
      <a href="/html/index.html">
        <button class="side-btn">
          <i class="fa-solid fa-house"></i>
        </button>
      </a>
    </aside>

    <main class="main-content">
      <div class="header">
        <h1>Calendar</h1>
        <p>View your saved events, event requests, and friend events</p>
      </div>

      <div class="calendar-controls-wrapper">
        <div class="calendar-nav">
          <button class="card-btn" id="prevMonthBtn">
            <i class="fa-solid fa-chevron-left"></i>
          </button>

          <h2 id="currentMonthLabel"></h2>

          <button class="card-btn" id="nextMonthBtn">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <div class="calendar-layout">
        <aside class="calendar-sidebar">
          <h3>Calendars</h3>

          <label class="calendar-select-all">
            <span>Select All</span>
            <input type="checkbox" id="check-all" checked>
          </label>

          <hr>

          <label class="calendar-you">
            <span>My Calendar</span>
            <input type="checkbox" id="check-my-calendar" checked>
          </label>

          <label class="calendar-group">
            <span>Event Requests</span>
            <input type="checkbox" id="check-event-requests" checked>
          </label>

          <label class="calendar-friends">
            <span>Friend Events</span>
            <input type="checkbox"id="check-friend-events" checked>
          </label>
        </aside>

        <section class="calendar-main">
          <div id="calendarEvents" class="calendar-container"></div>
        </section>
      </div>
    </main>

    <aside class="sidebar-right">
      <a href="/html/profile.html">
        <button class="side-btn">
          <i class="fa-solid fa-user"></i>
        </button>
      </a>

      <a href="/html/calendar.html">
        <button class="side-btn active">
          <i class="fa-solid fa-calendar"></i>
        </button>
      </a>

      <a href="/html/friends.html">
        <button class="side-btn">
          <i class="fa-solid fa-user-group"></i>
        </button>
      </a>

      <a href="/html/event-request.html">
        <button class="side-btn">
          <i class="fa-solid fa-plus"></i>
        </button>
      </a>
    </aside>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/calendar.js"></script>
</body>
</html>
