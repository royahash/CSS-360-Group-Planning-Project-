<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Calendar</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="page-layout">

  <!-- LEFT -->
  <div class="sidebar-left">
    <a href="index.html">
        <button class="side-btn"><i class="fa-solid fa-house"></i></button>
    </a>
  </div>

  <!-- CENTER -->
  <div class="main-content">

    <div class="header">
      <h1>Calendar</h1>
      <p>View your schedule and friends' events</p>

      <div class="calendar-controls-wrapper">
        <div class="calendar-controls">
          <button onclick="setView('month')" class="card-btn">Monthly</button>
          <button onclick="setView('week')" class="card-btn">Weekly</button>
        </div>
      </div>
    </div>

    <div class="calendar-layout">

      <!-- SIDEBAR -->
      <div class="calendar-sidebar">
        <h3>Calendars</h3>

        <!-- SELECT ALL -->
        <label class="calendar-select-all">
          Select All
          <input id="check-all" type="checkbox" checked onchange="toggleSelectAll()">
        </label>

        <!-- DIVIDER (optional but nice) -->
        <hr>

        <!-- INDIVIDUALS -->
        <label class="calendar-you">
          You
          <input id="check-you" type="checkbox" checked onchange="togglePerson()">
        </label>

        <label class="calendar-alex">
          Alex
          <input id="check-alex" type="checkbox" checked onchange="togglePerson()">
        </label>

        <label class="calendar-jordan">
          Jordan
          <input id="check-jordan" type="checkbox" checked onchange="togglePerson()">
        </label>
      </div>
      
      <!-- CALENDAR -->
      <div class="calendar-main">
        <div class="calendar-container" id="calendar"></div>
      </div>

    </div>

  </div>

  <!-- RIGHT -->
  <div class="sidebar-right">
    <a href="profile.html">
      <button class="side-btn"><i class="fa-solid fa-user"></i></button>
    </a>
    <button class="side-btn active"><i class="fa-solid fa-calendar"></i></button>
    <button class="side-btn"><i class="fa-solid fa-user-group"></i></button>
    <a href="event-request.html">
      <button class="side-btn"><i class="fa-solid fa-plus"></i></button>
    </a>
  </div>

</div>

<script src="../js/calendar.js"></script></body>
</html>
