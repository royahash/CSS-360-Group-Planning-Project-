<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Registration.css">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        
        <div class="error" id="userError"></div>
        <input id="usernameOrEmail" placeholder="Username or Email">
        
        <div class="error" id="passError"></div>
        <input id="password" type="password" placeholder="Password">
        
        <button id="loginButton" disabled>Login</button>
        <button id="togglePassword" type="button">Show/Hide Password</button>
        
        <span class="link" onclick="window.location.href = 'SignUp.html'">Create account</span>
    </div>

    <script type="module">
        import { findUser, checkCredentials } from './auth.js';
        const loginButton = document.getElementById("loginButton");
        
        loginButton.onclick = () => {
            const userError = document.getElementById("userError");
            const passError = document.getElementById("passError");
            userError.textContent = "";
            passError.textContent = "";

            const id = document.getElementById('usernameOrEmail').value.trim();
            const pass = document.getElementById('password').value;

            if (!findUser(id)) {
                userError.textContent = "Username/email not found";
            } else if (!checkCredentials(id, pass)) {
                passError.textContent = "Incorrect password";
            } else {
                window.location.href = 'onboarding.html';
            }
        };
    </script>
</body>
</html>
