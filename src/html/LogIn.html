<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Registration.css">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        
        <div class="error" id="userError"></div>
        <input id="usernameOrEmail" placeholder="Username or Email">
        
        <div class="error" id="passError"></div>
        <input id="password" type="password" placeholder="Password">
        
        <button id="loginButton" disabled>Login</button>
        <button id="togglePassword" type="button">Show/Hide Password</button>
        
        <span class="link" onclick="window.location.href = 'SignUp.html'">Create account</span>
    </div>

        <script type="module">
    const loginButton = document.getElementById("loginButton");

    loginButton.onclick = async () => {
        const userError = document.getElementById("userError");
        const passError = document.getElementById("passError");
        userError.textContent = "";
        passError.textContent = "";

        const identifier = document.getElementById('usernameOrEmail').value.trim();
        const password   = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ identifier, password })
            });
            const data = await res.json();

            if (!res.ok) {
                if (data.error === 'User not found')   userError.textContent = data.error;
                else if (data.error === 'Incorrect password') passError.textContent = data.error;
                else userError.textContent = data.error;
                return;
            }

            localStorage.setItem('token',    data.token);
            localStorage.setItem('username', data.username);
            localStorage.setItem('userId',   data.userId);
            window.location.href = 'index.html';
        } catch (err) {
            userError.textContent = 'Login failed. Try again.';
        }
    };
        </script>
</body>
</html>
