<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Profile</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="page-layout">

    <div class="sidebar-left">
      <a href="/html/index.html">
        <button class="side-btn"><i class="fa-solid fa-house"></i></button>
      </a>
    </div>

  <div class="main-content">
    <div class="header">
      <h1>My Profile</h1>
      <p>Your event preferences and onboarding choices</p>
    </div>

    <div class="profile-card" style="position:relative;">
      <button class="card-btn" id="signOutBtn" style=" position:absolute; top:53px; right:35px; background:rgb(252, 209, 209); color:black; border-color:black; font-weight:450;">
        <i class="fa-solid fa-sign-out" style="margin-right:6px;"></i>Sign Out</button>
      <div class="profile-header" style="justify-content: flex-start;">
        <div class="profile-avatar">
          <img id="profile-photo" src="" alt="Profile photo"
               style="width:100%; height:100%; border-radius:50%; display:none; object-fit:cover;">
          <i id="profile-icon" class="fa-solid fa-user"></i>
        </div>
        <div>
          <h2 id="profile-name">Welcome back</h2>
          <p id="profile-email">Loading your profile...</p>
        </div>
      </div>

      <div class="profile-info-card">
        <h3> Your Interests </h3>
        <div id="interestList" class="interest-list"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
          You have not chosen any interests yet. Visit onboarding to save your favorite event categories.
        </div>
      </div>

      <div class="profile-actions" style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; gap:8px;">
        <a href="/html/friends.html"><button class="card-btn" style="background:#d1e8fd; color:black; border-color:black; font-weight:450;">
        <i class="fa-solid fa-user-group" style="margin-right:6px;"></i>Manage Friends</button></a>
        <a href="/html/onboarding.html"><button class="card-btn" style="background:rgb(233, 253, 211); color:black; border-color:black; font-weight:450;">
        <i class="fa-solid fa-tag" style="margin-right:6px;"></i>Update Interests</button></a>
        </div>

      </div>
    </div>
  </div>

    <div class="sidebar-right">
      <a href="/html/profile.html">
        <button class="side-btn active"><i class="fa-solid fa-user"></i></button>
      </a>
      <a href="/html/calendar.html">
        <button class="side-btn"><i class="fa-solid fa-calendar"></i></button>
      </a>
      <a href="/html/friends.html">
        <button class="side-btn "><i class="fa-solid fa-user-group"></i></button>
      </a>
      <a href="/html/event-request.html">
        <button class="side-btn"><i class="fa-solid fa-plus"></i></button>
      </a>
    </div>

  </div>

<script type="module">
  import { getCurrentUser, logout } from '/js/auth.js';

  const user = await getCurrentUser();

  if (!user) {
    window.location.href = '/html/LogIn.html';
  } else {
    // Show name and email
    document.getElementById('profile-name').textContent = user.displayName;
    document.getElementById('profile-email').textContent = user.email;

    // Show Google profile photo if available
    if (user.photo) {
      const img = document.getElementById('profile-photo');
      const icon = document.getElementById('profile-icon');
      img.src = user.photo;
      img.style.display = 'block';
      icon.style.display = 'none';
    }

    // Load preferences from database
    const interestList = document.getElementById('interestList');
    const emptyState = document.getElementById('emptyState');

    if (!user.preferences || user.preferences.length === 0) {
      interestList.innerHTML = '';
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      interestList.innerHTML = user.preferences
        .map(interest => `<span class="interest-chip">${interest}</span>`)
        .join('');
    }

    // Sign out button
    document.getElementById('signOutBtn').onclick = logout;
  }
</script>
</body>
</html>
