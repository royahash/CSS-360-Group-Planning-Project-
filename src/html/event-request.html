<!DOCTYPE html>
<html>
<head>
  <title>Request an Event</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="event-request.css">

  <style>
    .hidden { display: none !important; }
    .success-card {
      margin-top: 20px;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <div class="top-left-nav">
    <a href="index.html">
      <button class="nav-btn"><i class="fa-solid fa-house"></i></button>
    </a>

    <a href="profile.html">
      <button class="nav-btn"><i class="fa-solid fa-user"></i></button>
    </a>

    <a href="calendar.html">
      <button class="nav-btn"><i class="fa-solid fa-calendar"></i></button>
    </a>
  </div>

  <div class="header">
    <h1>Request an Event</h1>
    <p>Suggest a date, time, and location for friends to accept or deny.</p>
  </div>

  <div class="pink-section">

    <div class="form-card">

      <h2>Send Event Request</h2>

      <form id="eventForm">

        <label>Event Name</label>
        <input type="text" id="eventName" placeholder="Example: Study Group" required>

        <label>Date</label>
        <input type="date" id="eventDate" required>

        <label>Time</label>
        <input type="time" id="eventTime" required>

        <label>Location</label>
        <input type="text" id="eventLocation" placeholder="Example: UW Bothell Library" required>

        <button type="submit" class="submit-btn">Create Request</button>

      </form>

    </div>
  </div>

  <script src="event-request.js"></script>
</body>
</html>
