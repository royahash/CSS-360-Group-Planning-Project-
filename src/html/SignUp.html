<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Registration.css">
</head>
<body>  
    <div class="container">
        <h2>Sign Up</h2>
        <div class="error" id="error"></div>
        
        <input id="username" placeholder="Username">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <div class="error" id="confirmError"></div>
        <input id="confirmPassword" type="password" placeholder="Confirm Password">
        
        <button id="signupButton" disabled>Sign Up</button>
        <button id="togglePassword" type="button">Show/Hide Password</button>
        
        <span class="link" onclick="window.location.href = 'LogIn.html'">Already have an account?</span>
    </div>

<script type="module">
  import { getCurrentUser } from '../js/auth.js';

  getCurrentUser().then(user => {
    if (user) window.location.href = '/html/index.html';
  });

  const signupButton = document.getElementById('signupButton');
  const errorDiv = document.getElementById('error');
  const confirmError = document.getElementById('confirmError');

  signupButton.onclick = async () => {
    errorDiv.textContent = '';
    confirmError.textContent = '';

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (password !== confirm) {
      confirmError.textContent = "Passwords don't match!";
      return;
    }

    try {
      const response = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, email, password }),
      });

      const data = await response.json();

      if (!response.ok) {
        errorDiv.textContent = data.error;
        return;
      }

      window.location.href = '/html/index.html';
    } catch (err) {
      errorDiv.textContent = 'Something went wrong. Please try again.';
    }
  };
</script>
</body>
</html>
