<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Registration.css">
</head>
<body>  
    <div class="container">
        <h2>Sign Up</h2>
        <div class="error" id="error"></div>
        
        <input id="username" placeholder="Username">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <div class="error" id="confirmError"></div>
        <input id="confirmPassword" type="password" placeholder="Confirm Password">
        
        <button id="signupButton" disabled>Sign Up</button>
        <button id="togglePassword" type="button">Show/Hide Password</button>
        
        <span class="link" onclick="window.location.href = 'LogIn.html'">Already have an account?</span>
    </div>

        <script type="module">
    const signupButton  = document.getElementById("signupButton");
    const errorDiv      = document.getElementById("error");
    const confirmError  = document.getElementById("confirmError");

    signupButton.onclick = async () => {
        errorDiv.textContent      = "";
        confirmError.textContent  = "";

        const username = document.getElementById('username').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirmPassword').value;

        if (password !== confirm) {
            confirmError.textContent = "Passwords don't match!";
            return;
        }

        try {
            const res = await fetch('/api/auth/register', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ username, email, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            localStorage.setItem('token',    data.token);
            localStorage.setItem('username', data.username);
            localStorage.setItem('userId',   data.userId);
            window.location.href = 'onboarding.html';
        } catch (err) {
            errorDiv.textContent = err.message;
        }
    };
        </script>
</body>
</html>
